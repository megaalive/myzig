name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Also run windows + macos (macos bills 10× Actions minutes)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Private repos: default ubuntu only. Full OS matrix via workflow_dispatch.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full_matrix && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          # Keep in sync with build.zig.zon minimum_zig_version.
          version: "0.17.0-dev.1099+7db2ef610"
          cache-key: ${{ matrix.os }}

      - name: zig version
        run: zig version

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check src build.zig

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: CLI smoke
        shell: bash
        run: bash scripts/ci-smoke.sh

      - name: Upload SARIF (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif.json
          category: myzig
