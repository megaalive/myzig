name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          # Keep in sync with build.zig.zon minimum_zig_version.
          version: "0.17.0-dev.1099+7db2ef610"
          cache-key: ${{ matrix.os }}

      - name: zig version
        run: zig version

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check src build.zig

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          BIN="zig-out/bin/myzig"
          if [[ ! -x "$BIN" && -x "${BIN}.exe" ]]; then BIN="${BIN}.exe"; fi
          "$BIN" version
          "$BIN" rules --json | head -n 5
          "$BIN" init
          test -f .myzig/README.md
          # Fail fixture must report findings (non-zero).
          if "$BIN" check fixtures/fail/alloc_undischarged.zig; then
            echo "expected findings on fail fixture" >&2
            exit 1
          fi
          # Pass fixture must be clean.
          "$BIN" check fixtures/pass/alloc_defer_free.zig
          "$BIN" check fixtures/pass/file_defer_close.zig
          "$BIN" check fixtures/pass/ptrcast_remarked.zig
          if "$BIN" check fixtures/fail/file_undischarged.zig; then
            echo "expected file finding" >&2
            exit 1
          fi
          if "$BIN" check fixtures/fail/ptrcast_unremarked.zig; then
            echo "expected ptrcast finding" >&2
            exit 1
          fi
          # Explain + receipt for the known finding.
          "$BIN" explain fixtures/fail/alloc_undischarged.zig:11 | head -n 20
          set +e
          "$BIN" receipt fixtures/fail/alloc_undischarged.zig > receipt.json
          code=$?
          set -e
          head -n 8 receipt.json
          test "$code" -ne 0
          grep -q '"findings": 1' receipt.json
          "$BIN" explain --rule memory.alloc-undischarged | head -n 10
